<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Travel Itinerary Generator</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🌍 AI-Powered Travel Itinerary Generator</h1>
            <p class="tagline">Plan your perfect trip with AI assistance</p>
        </header>

        <main>
            <form id="itineraryForm">
                <div class="form-group">
                    <label for="destination">Destination</label>
                    <input type="text" id="destination" name="destination"
                           placeholder="e.g., Paris, Tokyo, New York" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="duration">Duration (days)</label>
                        <input type="number" id="duration" name="duration"
                               min="1" max="30" value="5" required>
                    </div>

                    <div class="form-group">
                        <label for="budget">Budget Level</label>
                        <select id="budget" name="budget" required>
                            <option value="budget">Budget-Friendly</option>
                            <option value="moderate" selected>Moderate</option>
                            <option value="luxury">Luxury</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="interests">Interests (select all that apply)</label>
                    <div class="checkbox-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="interests" value="culture"> Culture & History
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="interests" value="food"> Food & Dining
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="interests" value="adventure"> Adventure & Sports
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="interests" value="nature"> Nature & Wildlife
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="interests" value="shopping"> Shopping
                        </label>
                        <label class="checkbox-label">
                            <input type="checkbox" name="interests" value="relaxation"> Relaxation
                        </label>
                    </div>
                </div>

                <div class="form-group">
                    <label for="travelStyle">Travel Style</label>
                    <select id="travelStyle" name="travelStyle" required>
                        <option value="solo">Solo Travel</option>
                        <option value="couple">Couple</option>
                        <option value="family">Family</option>
                        <option value="group">Group</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="preferences">Additional Preferences</label>
                    <textarea id="preferences" name="preferences" rows="3"
                              placeholder="Any specific requirements or preferences..."></textarea>
                </div>

                <button type="submit" class="btn-primary" id="generateBtn">
                    Generate Itinerary
                </button>
            </form>

            <div id="loading" class="loading hidden">
                <div class="spinner"></div>
                <p>Generating your personalized itinerary...</p>
            </div>

            <div id="results" class="results hidden">
                <h2>Your Personalized Travel Itinerary</h2>
                <div id="itineraryContent"></div>
                <button class="btn-secondary" id="newItineraryBtn">Create New Itinerary</button>
            </div>
        </main>

        <footer>
            <p>Powered by AI | Simple AWS Architecture</p>
        </footer>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
